name: Make episode

on:
  schedule:
    - cron: "23 13 * * *"        # every day 13:23 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (blank = next in rotation): colors, animals, shapes, counting, fruits"
        required: false
        default: ""

permissions:
  contents: write

concurrency: make-video

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config
          pip install -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Make episode + shorts
        id: make
        run: python make_episode.py ${{ inputs.topic && format('--topic {0}', inputs.topic) || '' }}
      - name: Publish for review (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR="${{ steps.make.outputs.dir }}"
          gh release create "ep-$(date -u +%Y%m%d-%H%M)" "$DIR"/* \
            --title "${{ steps.make.outputs.title }}" --notes-file "$DIR/UPLOAD.txt"
      - name: Save history
        run: |
          git config user.name "episode-bot"
          git config user.email "episode-bot@users.noreply.github.com"
          git add episodes.json
          git commit -m "Episode: ${{ steps.make.outputs.title }}" || exit 0
          git pull --rebase -q origin main && git push
