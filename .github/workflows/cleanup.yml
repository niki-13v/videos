name: Delete old story releases (one-time)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name | select(startswith("story-"))'); do
            gh release delete "$tag" --cleanup-tag --yes -R "${{ github.repository }}" && echo "deleted $tag"
          done
